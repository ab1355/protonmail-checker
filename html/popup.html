<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>ProtonMail Inbox Agent</title>
  <link media="all" href="../css/popup.css" type="text/css" rel="stylesheet"/>
</head>
<body>

<div id="header">
  <img src="../icons/icon-48.png" alt="ProtonMail"/>
  <h1>Inbox Agent</h1>
</div>

<div id="summary">
  <div id="summary-stats">Loading inbox data&hellip;</div>
</div>

<div id="email-list-container">
  <div id="email-list">
    <p id="no-emails-msg" class="placeholder">
      No ProtonMail tab found.<br/>Open ProtonMail to see your inbox.
    </p>
  </div>
</div>

<div id="actions">
  <button id="btn-mark-read" title="Mark all visible emails as read">Mark All Read</button>
  <button id="btn-open-protonmail">Open ProtonMail</button>
</div>

<script type="text/javascript" src="../scripts/popup.js"></script>
</body>
</html>
